version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: steriox-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - backend-network

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: steriox-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    restart: unless-stopped
    networks:
      - backend-network

volumes:
  redis-data:
  rabbitmq-data:

networks:
  backend-network:
    driver: bridge
