version: '3.8'

services:
  nginx-rtmp:
    image: tiangolo/nginx-rtmp:latest
    container_name: nginx-rtmp-server
    ports:
      - "1935:1935"  # Cổng cho luồng RTMP
      - "8080:80"    # Cổng HTTP để kiểm tra (Truy cập bằng localhost:8080)
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: always