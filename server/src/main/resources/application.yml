server:
    port: ${PORT:8080}
    servlet:
        context-path: "/api"

spring:
    profiles:
        active: local
    application:
        name: "SterioX"
    datasource:
        url: ${DBMS_CONNECTION:jdbc:postgresql://localhost:5432/sterio_x}
        driverClassName: org.postgresql.Driver
        password: ${DBMS_PASSWORD:root}
        username: ${DBMS_USERNAME:root}
    jpa:
        hibernate:
            ddl-auto: update
    servlet:
        multipart:
            max-file-size: 10MB
            max-request-size: 50MB
    data:
        redis:
            host: ${REDIS_HOST}
            port: ${REDIS_PORT}
    cache:
        type: redis
    rabbitmq:
        host: ${RABBITMQ_HOST:localhost}
        port: ${RABBITMQ_PORT:5672}
        username: ${RABBITMQ_USERNAME:guest}
        password: ${RABBITMQ_PASSWORD:guest}
        listener:
            simple:
                retry:
                    enabled: true
                    initial-interval: 3000
                    max-attempts: 3
                    multiplier: 1.5
            
jwt:
    secret-key: ${JWT_SECRET_KEY:local-dev-secret-key-32bytes!!!}
    valid-duration: ${JWT_EXPIRATION_S:3600}
    refreshable-duration: ${JWT_REFRESHABLE_S:86400}

aws:
    s3:
        bucket-name: ${AWS_S3_BUCKET_NAME}
        region: ${AWS_S3_REGION}
        access-key: ${AWS_S3_ACCESS_KEY}
        secret-key: ${AWS_S3_SECRET_KEY}